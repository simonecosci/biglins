services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${APP_PORT:-8080}:80'
    env_file:
      - .env
    environment:
      DB_DATABASE: /data/database.sqlite
      APP_URL: http://localhost:${APP_PORT:-8080}
    volumes:
      - storage:/app/storage
      - database:/data
      - logos:/app/public/images/companies
    restart: unless-stopped

volumes:
  storage:
  database:
  logos:
